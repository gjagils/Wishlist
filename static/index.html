<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Boekjes van Gerd-Jan</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='20' y='15' width='60' height='70' rx='3' fill='%2300A699'/%3E%3Crect x='25' y='20' width='50' height='60' fill='%23fff'/%3E%3Cline x1='35' y1='30' x2='65' y2='30' stroke='%2300A699' stroke-width='2'/%3E%3Cline x1='35' y1='40' x2='65' y2='40' stroke='%2300A699' stroke-width='2'/%3E%3Cline x1='35' y1='50' x2='65' y2='50' stroke='%2300A699' stroke-width='2'/%3E%3Cline x1='35' y1='60' x2='55' y2='60' stroke='%2300A699' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">
                <div class="brand-wishlist">Wishlist</div>
                <div class="brand-name">Boekjes van Gerd-Jan</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="/" class="nav-item active">
                <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V15a1 1 0 11-2 0V4.804z"/></svg>
                Wishlist
            </a>
            <a href="https://boekjes.gerdjan.nl" class="nav-item" target="_blank">
                <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
                Bibliotheek
            </a>
            <a href="/admin" class="nav-item" id="nav-admin" style="display:none">
                <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/></svg>
                Gebruikers
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user" id="sidebar-user"></div>
            <a href="/logout" class="nav-item nav-logout">
                <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h12a1 1 0 001-1V4a1 1 0 00-1-1H3zm7.707 3.293a1 1 0 010 1.414L9.414 9H17a1 1 0 110 2H9.414l1.293 1.293a1 1 0 01-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                Uitloggen
            </a>
        </div>
    </aside>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <button class="menu-toggle" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="mobile-brand">
            <span class="brand-wishlist-sm">Wishlist</span>
            <span class="brand-name-sm">Boekjes van Gerd-Jan</span>
        </div>
        <button class="icon-btn" onclick="toggleSettings()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
        </button>
    </header>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Stats Cards -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">TOTAAL</div>
                <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#00A699" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-pending">0</div>
                <div class="stat-label">PENDING</div>
                <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#DB7A54" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-searching">0</div>
                <div class="stat-label">ZOEKEN</div>
                <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#2E7DCE" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-found">0</div>
                <div class="stat-label">GEVONDEN</div>
                <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#00A699" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
            </div>
        </div>

        <!-- Add Item Form -->
        <div class="add-card">
            <h2 class="section-title">Wishlist toevoegen</h2>
            <form id="add-form" class="add-form-inner">
                <div class="form-group">
                    <label for="author">AUTEUR</label>
                    <input type="text" id="author" placeholder="bijv. Donna Tartt" required>
                </div>
                <div class="form-group">
                    <label for="title">TITEL</label>
                    <input type="text" id="title" placeholder="bijv. The Secret History" required>
                </div>
                <div class="form-group" id="shelf-group" style="display:none">
                    <label for="shelf">PLANK</label>
                    <select id="shelf">
                        <option value="">Selecteer plank</option>
                    </select>
                </div>
                <div class="form-group form-submit">
                    <button type="submit" class="btn-add">Add to Wishlist</button>
                </div>
            </form>
            <div id="add-message" class="toast-message"></div>
        </div>

        <!-- Settings Panel -->
        <div id="settings-panel" class="settings-card" style="display:none">
            <h2 class="section-title">Instellingen</h2>
            <div class="setting-row">
                <div class="setting-info">
                    <strong>Logging</strong>
                    <p>Sla activiteit bij in de database</p>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="setting-logging" onchange="saveSetting('logging_enabled', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-bar">
            <div class="filter-tabs">
                <button class="filter-tab active" data-status="all">All</button>
                <button class="filter-tab" data-status="pending">Pending</button>
                <button class="filter-tab" data-status="searching">Search</button>
                <button class="filter-tab" data-status="found">Found</button>
                <button class="filter-tab" data-status="shelved">Shelved</button>
                <button class="filter-tab" data-status="failed">Failed</button>
            </div>
            <div class="filter-actions">
                <button class="action-link" id="btn-search-now" onclick="startSearchNow()">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    Nu zoeken
                </button>
                <button class="action-link danger" onclick="deleteAllFound()">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                    Opruimen
                </button>
            </div>
        </div>

        <!-- Wishlist Grid -->
        <div id="loading" class="loading-state">
            <div class="loading-spinner"></div>
            <p>Laden...</p>
        </div>
        <div id="wishlist-container" class="wishlist-grid"></div>

        <!-- Recent Logs (alleen admin) -->
        <div class="logs-card" id="logs-card" style="display:none">
            <h2 class="section-title">Recente Activiteit</h2>
            <div id="logs-container"></div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal" style="display:none" onclick="closeEditModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 class="section-title">Item bewerken</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="edit-author">AUTEUR</label>
                    <input type="text" id="edit-author" required>
                </div>
                <div class="form-group">
                    <label for="edit-title">TITEL</label>
                    <input type="text" id="edit-title" required>
                </div>
                <div class="form-group" id="edit-shelf-group">
                    <label for="edit-shelf">PLANK</label>
                    <select id="edit-shelf">
                        <option value="">— Geen —</option>
                    </select>
                </div>
                <div class="edit-options">
                    <label class="edit-checkbox">
                        <input type="checkbox" id="edit-no-cover">
                        Geen cover zoeken voor dit boek
                    </label>
                </div>
                <div class="edit-modal-actions">
                    <button type="submit" class="btn-add">Opslaan</button>
                    <button type="button" class="btn-modal-cancel" onclick="closeEditModal()">Annuleren</button>
                </div>
            </form>
            <div id="edit-message" class="toast-message"></div>
        </div>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav">
        <a href="https://boekjes.gerdjan.nl" class="bottom-nav-item" target="_blank">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
            Books
        </a>
        <a href="/" class="bottom-nav-item active">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            Wishlist
        </a>
        <button class="bottom-nav-item" onclick="toggleSettings()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            Settings
        </button>
    </nav>

    <script src="/static/app.js"></script>
</body>
</html>
