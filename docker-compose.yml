version: '3.8'

services:
  wishlist:
    image: ghcr.io/gjagils/wishlist:latest
    container_name: wishlist
    restart: unless-stopped

    ports:
      - "6754:5000"

    volumes:
      - /volume1/docker/wishlist/data:/data

    environment:
      # === VERPLICHT ===
      - SPOTWEB_BASE_URL=${SPOTWEB_BASE_URL}
      - SPOTWEB_APIKEY=${SPOTWEB_APIKEY}
      - SAB_BASE_URL=${SAB_BASE_URL}
      - SAB_APIKEY=${SAB_APIKEY}

      # === OPTIONEEL ===
      - SAB_CATEGORY=${SAB_CATEGORY:-books}
      - SPOTWEB_CAT=${SPOTWEB_CAT:-7020}
      - WEB_USERNAME=${WEB_USERNAME:-admin}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - INTERVAL_SECONDS=${INTERVAL_SECONDS:-900}
      - DB_PATH=${DB_PATH:-/data/wishlist.db}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
      - PYTHONUNBUFFERED=1

      # === Email monitoring ===
      - EMAIL_ADDRESS=${EMAIL_ADDRESS:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_IMAP_SERVER=${EMAIL_IMAP_SERVER:-imap.gmail.com}
      - EMAIL_IMAP_PORT=${EMAIL_IMAP_PORT:-993}
      - EMAIL_CHECK_INTERVAL=${EMAIL_CHECK_INTERVAL:-300}
      - EMAIL_ALLOWED_SENDERS=${EMAIL_ALLOWED_SENDERS:-}

      # === Auto-login (voor Calibre-Web link) ===
      - AUTOLOGIN_KEY=${AUTOLOGIN_KEY:-}

      # === Calibre-Web ===
      - CALIBREWEB_URL=${CALIBREWEB_URL:-}
      - CALIBREWEB_USERNAME=${CALIBREWEB_USERNAME:-}
      - CALIBREWEB_PASSWORD=${CALIBREWEB_PASSWORD:-}

      # === SMTP ===
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
